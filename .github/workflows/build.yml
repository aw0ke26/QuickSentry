name: Build EXE

# Push a tag like v2.0.0 to build QuickSentry.exe and attach it to a GitHub Release.
# You can also run it by hand from the Actions tab (Run workflow).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          python tests/test_parsers.py
          python tests/test_engine.py
          python tests/test_path.py

      - name: Build
        run: pyinstaller --onefile --windowed --clean --name QuickSentry --hidden-import pystray._win32 quicksentry_gui.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSentry
          path: dist/QuickSentry.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QuickSentry.exe
          generate_release_notes: true
