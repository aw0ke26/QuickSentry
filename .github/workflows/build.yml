name: Build EXE

# Push a tag like v1.0.0 to build ArpWatch.exe and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build
        run: pyinstaller --onefile --windowed --name ArpWatch arp_watch_gui.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArpWatch
          path: dist/ArpWatch.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ArpWatch.exe
          generate_release_notes: true
