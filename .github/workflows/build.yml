name: Build

# - Every push / pull request: run the tests and build the exe + installer (downloadable from the run).
# - Push a tag like v3.0.0: same, plus a GitHub Release with both files attached.
# - Or run it by hand from the Actions tab (Run workflow).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          python tests/test_parsers.py
          python tests/test_engine.py
          python tests/test_path.py
          python tests/test_guard.py

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import quicksentry; print(quicksentry.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match quicksentry/__init__.py version $v"
          }

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --clean --uac-admin --name QuickSentry --icon assets/QuickSentry.ico --add-data "rules;rules" quicksentry_gui.py

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.ver.outputs.version }}" installer\QuickSentry.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickSentry-${{ steps.ver.outputs.version }}
          path: |
            dist/QuickSentry.exe
            dist/QuickSentry-Setup-${{ steps.ver.outputs.version }}.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QuickSentry-Setup-${{ steps.ver.outputs.version }}.exe
            dist/QuickSentry.exe
          generate_release_notes: true
